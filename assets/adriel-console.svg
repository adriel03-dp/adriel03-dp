<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Adriel Perera Linux terminal profile</title>
  <desc id="desc">A restrained dark Linux terminal introducing Adriel Perera, a software engineering undergraduate focused on backend systems and applied AI.</desc>

  <defs>
    <linearGradient id="terminal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #39d353; font-weight: 700; }
      .command { fill: #f0f6fc; }
      .output { fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .accent { fill: #39d353; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="12" fill="url(#terminal-bg)" stroke="#30363d" stroke-width="2"/>
  <path d="M1 54H1199" stroke="#30363d" stroke-width="2"/>
  <rect x="22" y="16" width="24" height="22" rx="3" fill="#161b22" stroke="#39d353"/>
  <text x="34" y="32" text-anchor="middle" class="mono accent" font-size="13" font-weight="700">&gt;_</text>
  <text x="61" y="33" class="mono output" font-size="15">adriel@github:~ / bash</text>
  <text x="1168" y="33" text-anchor="end" class="mono muted" font-size="13">GNU/Linux</text>

  <path d="M705 82V350" stroke="#21262d"/>

  <text x="42" y="91" class="mono prompt" font-size="15">adriel@github:~$</text>
  <text x="205" y="91" class="mono command" font-size="15">whoami</text>
  <text x="42" y="135" class="mono command" font-size="34" font-weight="700">Adriel Perera</text>

  <text x="42" y="186" class="mono prompt" font-size="15">adriel@github:~$</text>
  <text x="205" y="186" class="mono command" font-size="15">cat /etc/role</text>
  <text x="42" y="219" class="mono output" font-size="17">Software Engineering Undergraduate</text>

  <text x="42" y="270" class="mono prompt" font-size="15">adriel@github:~$</text>
  <text x="205" y="270" class="mono command" font-size="15">printf "%s\n" "$FOCUS"</text>
  <text x="42" y="303" class="mono output" font-size="17">Backend systems / applied AI / reliable software</text>

  <text x="42" y="354" class="mono prompt" font-size="15">adriel@github:~$</text>
  <rect x="205" y="340" width="9" height="18" fill="#39d353"/>

  <text x="744" y="91" class="mono prompt" font-size="15">$</text>
  <text x="764" y="91" class="mono command" font-size="15">systemctl --user status portfolio</text>

  <text x="744" y="136" class="mono command" font-size="17" font-weight="700">portfolio.service</text>
  <circle cx="752" cy="169" r="5" fill="#39d353"/>
  <text x="768" y="174" class="mono accent" font-size="14">active</text>

  <text x="744" y="217" class="mono muted" font-size="14">Loaded:</text>
  <text x="826" y="217" class="mono output" font-size="14">verified repositories</text>

  <text x="744" y="252" class="mono muted" font-size="14">Scope:</text>
  <text x="826" y="252" class="mono output" font-size="14">backend / AI / distributed systems</text>

  <text x="744" y="287" class="mono muted" font-size="14">Method:</text>
  <text x="826" y="287" class="mono output" font-size="14">design -&gt; validate -&gt; test -&gt; observe</text>

  <text x="744" y="322" class="mono muted" font-size="14">Status:</text>
  <text x="826" y="322" class="mono output" font-size="14">open to engineering opportunities</text>

  <rect x="22" y="382" width="1156" height="2" fill="#39d353" opacity="0.72"/>
</svg>
