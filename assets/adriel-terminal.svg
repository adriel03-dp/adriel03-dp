      <text x="62" y="190" fill="#E6EDF3" font-size="72" font-weight="800" letter-spacing="-3">ADRIEL</text>
      <text x="62" y="260" fill="#3FB950" font-size="72" font-weight="800" letter-spacing="-3">PERERA</text>
      <text x="66" y="303" fill="#A7B0BA" font-size="17" letter-spacing="2.5">SOFTWARE ENGINEERING UNDERGRADUATE</text>
      <text x="66" y="352" fill="#E6EDF3" font-size="18">Backend systems. Practical AI. Distributed services.</text>

      <line x1="760" y1="94" x2="760" y2="408" stroke="#30363D" stroke-width="1" />
      <text x="804" y="112" fill="#3FB950" font-size="16" font-weight="700">/proc/adriel/focus</text>

      <text x="804" y="164" fill="#59636E" font-size="13">BACKEND</text>
      <text x="924" y="164" fill="#E6EDF3" font-size="18" font-weight="700">API boundaries / services</text>
      <line x1="804" y1="184" x2="1338" y2="184" stroke="#30363D" />

      <text x="804" y="226" fill="#59636E" font-size="13">AI</text>
      <text x="924" y="226" fill="#E6EDF3" font-size="18" font-weight="700">orchestration / model integration</text>
      <line x1="804" y1="246" x2="1338" y2="246" stroke="#30363D" />

      <text x="804" y="288" fill="#59636E" font-size="13">SYSTEMS</text>
      <text x="924" y="288" fill="#E6EDF3" font-size="18" font-weight="700">testing / containers / deployment</text>

