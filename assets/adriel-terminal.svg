      <path d="M1154 335L1162 341L1154 347" fill="none" stroke="#3FB950" stroke-width="2" />
      <text x="1180" y="346" fill="#E6EDF3" font-size="14">[MODEL]</text>

      <text x="64" y="446" fill="#8B949E" font-size="14">adriel@github:~$</text>
      <text x="238" y="446" fill="#E6EDF3" font-size="14">build --test --observe</text>
      <rect class="cursor" x="451" y="431" width="10" height="18" fill="#3FB950" />
      <text x="1338" y="446" fill="#59636E" font-size="13" text-anchor="end">SLIIT / YEAR 3</text>
    </g>
