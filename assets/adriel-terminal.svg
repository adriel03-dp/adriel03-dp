    <path d="M1040 0H1400V500H1215Z" fill="#3FB950" fill-opacity="0.035" />
    <text x="-8" y="392" fill="#3FB950" fill-opacity="0.035" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="350" font-weight="800">AP</text>

    <rect x="0" y="0" width="7" height="500" fill="#3FB950" />
    <rect x="0" y="0" width="1400" height="2" fill="#3FB950" />
    <path class="signal" d="M54 52H322L342 32L370 72L392 52H1346" fill="none" stroke="#3FB950" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="16 12" />
    <rect class="sweep" x="0" y="0" width="430" height="500" fill="url(#sweepFill)" />

    <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">
