<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Adriel Perera identity console</title>
  <desc id="desc">Software Engineering undergraduate focused on backend systems, applied AI, and distributed services.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B09" />
      <stop offset="0.58" stop-color="#0D1117" />
      <stop offset="1" stop-color="#07100A" />
    </linearGradient>
    <linearGradient id="sweepFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3FB950" stop-opacity="0.12" />
      <stop offset="1" stop-color="#3FB950" stop-opacity="0" />
    </linearGradient>
    <clipPath id="frame">
      <path d="M0 0H1400V454L1354 500H0Z" />
    </clipPath>
  </defs>

  <style>
    .cursor { animation: blink 1.05s steps(1,end) infinite; }
    .signal { animation: flow 2.8s linear infinite; }
    .sweep { animation: scan 6s ease-in-out infinite; }
    @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
    @keyframes flow { to { stroke-dashoffset:-96 } }
    @keyframes scan { 0%,12% { transform:translateX(-430px); opacity:0 } 28%,68% { opacity:1 } 88%,100% { transform:translateX(1400px); opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .signal, .sweep { animation:none; }
      .sweep { display:none; }
    }
  </style>

  <g clip-path="url(#frame)">
