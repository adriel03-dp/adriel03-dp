name: Profile metrics

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate terminal metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adriel03-dp
          template: terminal
          filename: assets/github-metrics.svg
          base: header, metadata
          config_timezone: Asia/Colombo
          extras_css: |
            .header {
              background: #161B22;
              border: 1px solid #30363D;
              border-bottom: 0;
            }
            .title,
            .banner,
            footer {
              color: #8B949E;
            }
            .button {
              color: #0D1117;
              background: #30363D;
              text-shadow: none;
            }
            .button.exit {
              background: #3FB950;
            }
            pre {
              color: #C9D1D9;
              background: #0D1117;
              border: 1px solid #30363D;
              border-top: 0;
            }
            .ps1-path,
            .ps1-location {
              color: #3FB950;
            }
            .isocalendar svg {
              filter: grayscale(1) sepia(1) hue-rotate(72deg) saturate(3) brightness(.82) opacity(.9);
            }
            .stdin,
            .stdout,
            footer {
              animation: none;
            }
            .stdin,
            footer {
              width: 100%;
            }
            .stdout {
              max-height: none;
            }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_colors: >-
            0:#56D364,
            1:#3FB950,
            2:#2EA043,
            3:#238636,
            4:#196C2E,
            5:#0F5323
